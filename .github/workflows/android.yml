
name: Build Workshop Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Prepare and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/khubara/workshop
          mkdir -p app/src/main/res/values

          cp MainActivity.kt app/src/main/java/com/khubara/workshop/
          cp WorkshopDb.kt app/src/main/java/com/khubara/workshop/
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/khubara/workshop/MainActivity.kt")
          source = p.read_text(encoding="utf-8")

          old = 'singleLine = type == "phone" || hintText.contains("السنة") || hintText.contains("العداد")'
          new = 'setSingleLine(type == "phone" || hintText.contains("السنة") || hintText.contains("العداد"))'

          if old not in source:
              raise SystemExit("ERROR: Could not find the singleLine expression")

          p.write_text(source.replace(old, new), encoding="utf-8")
          print("MainActivity.kt compatibility fix applied successfully")
          PY

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.2.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.khubara.workshop"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.khubara.workshop"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project structure
        run: |
          ls -R app
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/khubara/workshop/MainActivity.kt
          test -f app/src/main/java/com/khubara/workshop/WorkshopDb.kt
          test -f app/src/main/res/values/styles.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
