name: Build Workshop Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project structure
        run: |
          mkdir -p app/src/main/java/com/khubara/workshop
          mkdir -p app/src/main/res/values
          cp MainActivity.kt app/src/main/java/com/khubara/workshop/
          cp WorkshopDb.kt app/src/main/java/com/khubara/workshop/
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/khubara/workshop/MainActivity.kt")
          source = p.read_text(encoding="utf-8")
          old = 'singleLine = type == "phone" || hintText.contains("السنة") || hintText.contains("العداد")'
          new = 'setSingleLine(type == "phone" || hintText.contains("السنة") || hintText.contains("العداد"))'
          if old in source:
              source = source.replace(old, new)
              p.write_text(source, encoding="utf-8")
              print("MainActivity.kt compatibility fix applied")
          else:
              print("Compatibility expression not present; leaving source unchanged")
          PY


      - name: Install branding resources
        run: |
          test -f workshop_branding_package.zip
          unzip -o workshop_branding_package.zip -d .
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/drawable/ic_launcher_foreground.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          if "android:icon=" not in s:
              s = re.sub(r"<application\b", '<application\n        android:icon="@mipmap/ic_launcher"', s, count=1)
          if "android:roundIcon=" not in s:
              s = re.sub(r"<application\b", '<application\n        android:roundIcon="@mipmap/ic_launcher"', s, count=1)
          p.write_text(s, encoding="utf-8")
          print("Branding resources installed")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing KEYSTORE_PASSWORD repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/workshop-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/workshop-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias workshop-release >/dev/null
          echo "KEYSTORE_FILE=$RUNNER_TEMP/workshop-release.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=workshop-release" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Release signing key verified"

      - name: Check project structure
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/khubara/workshop/MainActivity.kt
          test -f app/src/main/java/com/khubara/workshop/WorkshopDb.kt
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f app/src/main/res/drawable/ic_launcher_foreground.png

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/workshop-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: workshop-release
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopManager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
