
name: Unpack Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          unzip -q WorkshopManagerAndroid-v0.1.0.zip -d /tmp/wm
          cp -a /tmp/wm/WorkshopManagerAndroid/. .
          rm -rf /tmp/wm
          rm -f WorkshopManagerAndroid-v0.1.0.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Android project source"
            git push
          fi
